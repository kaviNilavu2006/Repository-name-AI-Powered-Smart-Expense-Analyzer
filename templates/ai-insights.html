<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Insights — Smart Expense Analyzer</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  {% set active_page = 'ai-insights' %}
  {% include "_sidebar.html" %}

  <div class="main-content">
    {% set page_title = 'AI Insights' %}
    {% include "_topbar.html" %}

    <div class="page-body">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="ai-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0"><i class="bi bi-stars text-primary"></i> AI Spending Assistant</h5>
              <div class="d-flex gap-2 align-items-center">
                <span id="ai-source-badge" class="badge bg-secondary">Loading...</span>
                <button class="btn btn-sm btn-outline-primary" id="refresh-analysis-btn"><i class="bi bi-arrow-clockwise"></i></button>
              </div>
            </div>
            <div id="ai-analysis-content"></div>
            <div class="ai-disclaimer" id="ai-disclaimer"></div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="chart-card">
            <h6 class="fw-bold mb-3"><i class="bi bi-chat-dots"></i> Ask the AI Chat Assistant</h6>

            <div class="d-flex flex-wrap gap-2 mb-3">
              <button class="btn btn-sm btn-outline-secondary suggested-question">How much did I spend this month?</button>
              <button class="btn btn-sm btn-outline-secondary suggested-question">Where am I spending the most?</button>
              <button class="btn btn-sm btn-outline-secondary suggested-question">How can I reduce my expenses?</button>
              <button class="btn btn-sm btn-outline-secondary suggested-question">Give me a budget suggestion.</button>
            </div>

            <div class="chat-window" id="chat-window">
              <div class="chat-bubble ai">Hi! Ask me anything about your spending — I'll answer using your own expense data.</div>
            </div>

            <form id="chat-form" class="d-flex gap-2 mt-3">
              <input type="text" class="form-control" id="chat-input" placeholder="Type your question..." required>
              <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i></button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/ai-insights.js') }}"></script>
</body>
</html>
